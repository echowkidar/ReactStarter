# Attendance app stack (app + PostgreSQL 14).
# Portainer: Stacks -> Add stack -> paste this file (or use the git repo),
# set the variables below under "Environment variables".
#
# Host folders (create once):
#   /srv/attendance/pgdata   -> database files
#   /srv/attendance/uploads  -> uploaded PDFs / images
#   /srv/attendance/.env     -> copy of the app's .env (SMTP, OCR, Turnstile, ...)
#
# Required stack variables: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
# Optional: APP_PORT (default 5001), BASE_URL

services:
  db:
    image: postgres:14
    container_name: attendance-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /srv/attendance/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose - the database is only reachable from the app.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build: .
    container_name: attendance-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /srv/attendance/.env
    environment:
      NODE_ENV: production
      PORT: "5001"
      # overrides DATABASE_URL from .env so the app talks to the db container
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - /srv/attendance/uploads:/app/uploads
    ports:
      - "${APP_PORT:-5001}:5001"
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
