# Attendance app stack (app + PostgreSQL 14).
# Portainer: Stacks -> Add stack -> paste this file (or use the git repo),
# set the variables below under "Environment variables".
#
# Host folders (create once):
#   /srv/attendance/pgdata   -> database files
#   /srv/attendance/uploads  -> uploaded PDFs / images
#   /srv/attendance/pki      -> LPC certificate authority files (copy from the old server's dist/pki)
#
# All settings come from the stack's "Environment variables" in Portainer
# (Repository stacks do not create stack.env, so each variable is listed below):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD  (same as in DATABASE_URL)
#   SMTP_*, TURNSTILE_*, OCR_*, LPC_*, DISPATCH_*, *_OLLAMA_*, BASE_URL, ...
#   APP_PORT (optional, default 5001)

services:
  db:
    image: postgres:14
    container_name: attendance-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /srv/attendance/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Only on the PC itself (127.0.0.1), never on the network. For DBeaver etc. use an
    # SSH tunnel to this PC and connect to localhost:${DB_LOCAL_PORT:-5433}.
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5433}:5432"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build: .
    container_name: attendance-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5001"
      # overrides DATABASE_URL from the old .env so the app talks to the db container
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_OPTIONS: --max-old-space-size=768
      # values come from the stack's Environment variables in Portainer
      BASE_URL: ${BASE_URL:-}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      OCR_API_URL: ${OCR_API_URL:-}
      OCR_API_TOKEN: ${OCR_API_TOKEN:-}
      LPC_OCR_API_URL: ${LPC_OCR_API_URL:-}
      LPC_OCR_API_TOKEN: ${LPC_OCR_API_TOKEN:-}
      DISPATCH_API_URL: ${DISPATCH_API_URL:-}
      DISPATCH_API_KEY: ${DISPATCH_API_KEY:-}
      DISPATCH_OLLAMA_API_URL: ${DISPATCH_OLLAMA_API_URL:-}
      DISPATCH_OLLAMA_API_KEY: ${DISPATCH_OLLAMA_API_KEY:-}
      DISPATCH_OLLAMA_MODEL: ${DISPATCH_OLLAMA_MODEL:-}
      RECEIVE_OLLAMA_API_URL: ${RECEIVE_OLLAMA_API_URL:-}
      RECEIVE_OLLAMA_API_KEY: ${RECEIVE_OLLAMA_API_KEY:-}
      RECEIVE_OLLAMA_MODEL: ${RECEIVE_OLLAMA_MODEL:-}
      LPC_DISPATCH_EMAILS: ${LPC_DISPATCH_EMAILS:-}
    volumes:
      - /srv/attendance/uploads:/app/uploads
      # LPC signing CA (key + cert + p12). The app generates a NEW CA if this folder
      # is empty, so keep it persistent and seed it with the production CA.
      - /srv/attendance/pki:/app/dist/pki
    ports:
      - "${APP_PORT:-5001}:5001"
    mem_limit: 1g
    # the home router's DNS returns no MX for amu.ac.in; use public resolvers
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
